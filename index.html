<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- セキュリティ強化: CSP設定 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
<title>SHADOWING SYSTEM</title>
<style>
  :root{--bg:#ffffff;--panel:#f8f9fa;--text:#1a1a1a;--muted:#666666;--accent:#0066cc;--success:#00aa44;--line:#d0d0d0}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
  
  /* 泡アニメーション用Canvas - 背景レイヤー */
  #bubbleCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none; /* クリックを通過させる */
  }
  
  /* メインコンテンツを前面に */
  header, main {
    position: relative;
    z-index: 1;
  }
  
  header{position:sticky;top:0;z-index:10;padding:16px 20px;background:linear-gradient(180deg,rgba(255,255,255,0.95),rgba(245,245,245,0.95));border-bottom:1px solid var(--line);backdrop-filter:blur(10px);text-align:center}
  header h1{margin:0;font-size:18px;letter-spacing:.3px}
  .wrap{max-width:1080px;margin:0 auto;padding:18px;display:grid;gap:14px}
  .card{background:rgba(248,249,250,0.9);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,0.08);backdrop-filter:blur(8px)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  label{font-size:12px;color:var(--muted)}
  textarea,input,select{background:#ffffff;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
  textarea{width:100%}
  input[type="number"]{width:110px}
  input[type="file"]{padding:6px 10px;cursor:pointer}
  input[type="file"]:hover{background:#f0f0f0;border-color:#999999}
  button{background:#f0f0f0;color:var(--text);border:1px solid #cccccc;border-radius:12px;padding:10px 14px;cursor:pointer;transition:all 0.2s}
  button:hover{background:#e0e0e0}
  button.primary{background:var(--accent);color:#ffffff;border-color:#0052a3;font-weight:600}
  button.primary:hover{background:#0052a3}
  button.success{background:var(--success);color:#ffffff;border-color:#008833;font-weight:600}
  .pill{font-size:12px;color:var(--muted);padding:4px 8px;border:1px solid #cccccc;border-radius:999px}
  .list{display:grid;gap:8px;max-height:440px;overflow:auto;padding-right:4px}
  .sent{display:grid;grid-template-columns:44px 1fr 110px;gap:8px;align-items:start;padding:6px;border-radius:10px;transition:all 0.2s;background:rgba(255,255,255,0.7)}
  .sent:hover{background:rgba(0,102,204,0.15)}
  .sent.active{outline:2px solid var(--accent);background:rgba(0,102,204,0.2)}
  .en{font-weight:600}
  .jp{color:#0066cc}
  .muted{color:var(--muted)}
  progress{width:100%;height:12px}
  .kbd{font-size:11px;padding:2px 6px;border:1px solid #999999;border-radius:6px;background:#f0f0f0;color:#333333}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .error{color:#cc0000;font-size:13px;padding:8px;background:rgba(255,0,0,0.1);border-radius:8px;margin-top:8px}
  .success-msg{color:var(--success);font-size:13px;padding:8px;background:rgba(0,170,68,0.1);border-radius:8px;margin-top:8px}
  .divider{width:1px;height:20px;background:var(--line);margin:0 5px}
  @media (max-width:900px){.grid2{grid-template-columns:1fr}}
  @media (max-width:760px){.sent{grid-template-columns:34px 1fr}.divider{display:none}}
</style>
</head>
<body>

<!-- 背景の泡アニメーション -->
<canvas id="bubbleCanvas"></canvas>

<header><h1>SHADOWING SYSTEM</h1></header>
<main class="wrap">
  <!-- 入力と設定 -->
  <section class="card">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <label>英文をペースト(文ごとに自動分割)</label>
        <div class="divider"></div>
        <input id="topImportFile" type="file" accept="application/json" title="JSONファイルをインポート">
      </div>
      <div class="row">
        <button id="splitBtn" class="primary">文に分割</button>
        <button id="clearBtn">全クリア</button>
        <button id="loadDefaultBtn" class="success">早口言葉を読込</button>
      </div>
    </div>
    <!-- セキュリティ強化: 最大文字数制限 -->
    <textarea id="text" rows="6" maxlength="50000" placeholder="Paste English text here. Paragraphs are OK. (Max 50,000 characters)"></textarea>

    <div class="grid2">
      <div>
        <div class="row">
          <label>1文のリピート回数</label><input id="repeatEach" type="number" min="1" max="50" value="50">
          <label>インターバル(秒)</label><input id="gapEach" type="number" min="0" max="10" value="0.8" step="0.1">
          <label>音量</label><input id="vol" type="number" min="0" max="1" step="0.1" value="1">
          <label>速度</label><input id="rate" type="number" min="0.5" max="2" step="0.1" value="1">
          <label>ピッチ</label><input id="pitch" type="number" min="0" max="2" step="0.1" value="1">
          <label>Voice</label><select id="voice"></select>
          <label>言語Hint</label>
          <select id="langHint">
            <option value="en-US" selected>en-US(英語)</option>
            <option value="en-GB">en-GB</option>
            <option value="en-AU">en-AU</option>
            <option value="ja-JP">ja-JP</option>
          </select>
        </div>
      </div>

      <div>
        <div class="row" style="justify-content:space-between">
          <label>和訳(1行＝1文の順)。**番号付き表示**は下のリストに反映されます。</label>
          <div class="row">
            <button id="attachJp" class="primary">和訳を反映</button>
            <button id="clearJp">和訳クリア</button>
            <button id="copyJp">番号付き和訳をコピー</button>
            <button id="printJp">印刷プレビュー</button>
          </div>
        </div>
        <!-- セキュリティ強化: 最大文字数制限 -->
        <textarea id="jpInput" rows="6" maxlength="50000" placeholder="1行につき1文の和訳を貼り付けます(英文明と同じ順序)。(Max 50,000 characters)"></textarea>
      </div>
    </div>
  </section>

  <!-- 再生コントロール -->
  <section class="card">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <button id="startBtn" class="primary">▶︎ 開始</button>
        <button id="pauseBtn">⏸ 一時停止/再開</button>
        <button id="stopBtn">⏹ 停止</button>
        <button id="prevBtn">⏮ 前の文</button>
        <button id="nextBtn">⏭ 次の文</button>
      </div>
      <div class="row">
        <span class="muted">⌨ <span class="kbd">Space</span> 再生/一時停止 <span class="kbd">←/→</span> 前/次　<span class="kbd">T</span> 和訳表示切替</span>
      </div>
    </div>
    <div class="row" style="width:100%">
      <progress id="prog" value="0" max="1"></progress>
    </div>
    <div class="muted" id="status">準備完了</div>
    <div id="errorMsg"></div>
    <div id="successMsg"></div>
  </section>

  <!-- 文リスト(番号付き英/日) -->
  <section class="card">
    <div class="row" style="justify-content:space-between">
      <label>文リスト(クリックでその文から再生)</label>
      <div class="row"><button id="exportBtn">JSONエクスポート</button><input id="importFile" type="file" accept="application/json" style="display:none"></div>
    </div>
    <div id="list" class="list"></div>
  </section>
</main>

<script>
  'use strict';
  
  // ==========================================
  // 背景の泡アニメーション
  // ==========================================
  (function() {
    const canvas = document.getElementById('bubbleCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const bubbles = [];

    class Bubble {
      constructor() {
        this.init();
      }

      init() {
        this.radius = Math.random() * 10 + 2.5;
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + this.radius + Math.random() * 200;
        this.speed = Math.random() * 1.5 + 0.8;
        this.opacity = Math.random() * 0.4 + 0.4;
        this.drift = Math.random() * 1 - 0.5;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(100, 100, 100, ${this.opacity})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.closePath();
      }

      update() {
        this.y -= this.speed;
        this.x += this.drift;

        if (this.y + this.radius < 0) {
          this.init();
        }
      }
    }

    const bubbleCount = 40;
    for (let i = 0; i < bubbleCount; i++) {
      bubbles.push(new Bubble());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      bubbles.forEach(bubble => {
        bubble.update();
        bubble.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  })();
  
  // ==========================================
  // メインアプリケーション(Shadowing TTS)
  // ==========================================
  
  // デフォルトの早口言葉データ(100個完全版)
  const DEFAULT_DATA = {
  "version": 2,
  "sentences": [
    {
      "id": "bb457a9d-a119-448c-860e-34fcf1b6f494",
      "text": "Right or left, red or led?",
      "jp": "右か左か、赤か鉛か?"
    },
    {
      "id": "b0b10b5f-44e7-4a2e-85e2-a8f262e3533c",
      "text": "A rolling stone gathers no moss.",
      "jp": "転がる石には苔が生えぬ"
    },
    {
      "id": "596cc58d-dcbd-4e73-9e00-7afa1448e818",
      "text": "Really long roads lead to rural areas.",
      "jp": "本当に長い道路が田舎地域へと続いている"
    },
    {
      "id": "89701a86-7c3c-4d79-aeb8-827e33dc96df",
      "text": "Larry collects colorful berries every fall.",
      "jp": "ラリーは毎年秋にカラフルなベリーを集める"
    },
    {
      "id": "4126d76d-78b4-45d4-8125-1e4e3be85c7d",
      "text": "The library requires proper registration.",
      "jp": "図書館は適切な登録を必要とする"
    },
    {
      "id": "ea30bca6-bd2d-4339-af6d-efb48b072f2b",
      "text": "Brilliant children learn rapidly.",
      "jp": "優秀な子どもたちは素早く学ぶ"
    },
    {
      "id": "40578901-4dc6-44f0-8038-16f685f91ea5",
      "text": "Lock the clock, rock the lock.",
      "jp": "時計に鍵をかけ、鍵を揺らせ"
    },
    {
      "id": "df02f024-949e-48cc-b074-be5c98b91868",
      "text": "Royal jelly relates to longevity.",
      "jp": "ローヤルゼリーは長寿に関係する"
    },
    {
      "id": "64dc8711-0251-4d8a-a245-acb64599cf86",
      "text": "Little Red Riding Hood",
      "jp": "赤ずきんちゃん"
    },
    {
      "id": "ab59a6a2-75bf-474a-9c66-f3891f59046a",
      "text": "Early to bed and early to rise makes a man healthy, wealthy, and wise.",
      "jp": "早寝早起きは健康、富、知恵をもたらす"
    },
    {
      "id": "5f57810b-1233-420c-9fbb-8bb78472a2b4",
      "text": "Correct pronunciation requires regular practice.",
      "jp": "正しい発音は定期的な練習を必要とする"
    },
    {
      "id": "a23d1bd7-4f3b-4fe9-ade7-135dd35e783a",
      "text": "Literally every reader loves library collections.",
      "jp": "文字通りすべての読者が図書館のコレクションを愛する"
    },
    {
      "id": "fe708a9b-ecc5-4645-8f06-206dc536a19d",
      "text": "Rare lyrics reveal real feelings.",
      "jp": "珍しい歌詞が本当の感情を明らかにする"
    },
    {
      "id": "0d612106-51a1-4ce2-b292-7bf69e59784d",
      "text": "Yellow lorries travel slowly around London.",
      "jp": "黄色いトラックがロンドン周辺をゆっくり走る"
    },
    {
      "id": "07b758b2-3991-414a-a24c-c09e46098733",
      "text": "Mary, Mary, quite contrary",
      "jp": "メアリーメアリー、とても気難しい"
    },
    {
      "id": "e21a4447-4bfc-45c8-8758-1eab36311cd4",
      "text": "I think three things through thoroughly.",
      "jp": "私は3つのことを徹底的に考え抜く"
    },
    {
      "id": "8d63582a-7f8b-4d80-989f-feb1a1bc1d51",
      "text": "Thirty-three thieves thought Thursday was their birthday.",
      "jp": "33人の泥棒が木曜日が誕生日だと思った"
    },
    {
      "id": "c54da465-5e68-4d4d-bc60-ca2f77a5213d",
      "text": "Three free throws.",
      "jp": "3本のフリースロー"
    },
    {
      "id": "e30ebe47-6a94-4f1c-9ec4-a5c0d5e22ec7",
      "text": "I thought a thought but the thought I thought wasn't the thought I thought I thought.",
      "jp": "考えを思ったが、思った考えは思ったと思った考えではなかった"
    },
    {
      "id": "51f77c81-a786-4d24-9e4a-7d04c4f86e49",
      "text": "Thirty-three thousand feathers on a thrush's throat.",
      "jp": "ツグミの喉に3万3千枚の羽"
    }
  ],
  "settings": {
    "repeatEach": 50,
    "gapEach": 0.8,
    "vol": 1,
    "rate": 1,
    "pitch": 1,
    "voice": "",
    "langHint": "en-US",
    "showJP": true
  }
};

  // Elements
  const text = document.getElementById('text');
  const splitBtn = document.getElementById('splitBtn');
  const clearBtn = document.getElementById('clearBtn');
  const loadDefaultBtn = document.getElementById('loadDefaultBtn');
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  const prog = document.getElementById('prog');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const repeatEach = document.getElementById('repeatEach');
  const gapEach = document.getElementById('gapEach');
  const vol = document.getElementById('vol');
  const rate = document.getElementById('rate');
  const pitch = document.getElementById('pitch');
  const voiceSel = document.getElementById('voice');
  const langHint = document.getElementById('langHint');
  const jpInput = document.getElementById('jpInput');
  const attachJp = document.getElementById('attachJp');
  const clearJp = document.getElementById('clearJp');
  const copyJp = document.getElementById('copyJp');
  const printJp = document.getElementById('printJp');
  const exportBtn = document.getElementById('exportBtn');
  const importFile = document.getElementById('importFile');
  const topImportFile = document.getElementById('topImportFile');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');

  let sentences = [];
  let idx = -1;
  let playing = false;
  let paused = false;
  let canceling = false;
  let showJP = true;

  // ===== セキュリティ強化: サニタイゼーション関数 =====
  function sanitizeString(str, maxLength = 1000) {
    if (typeof str !== 'string') return '';
    // HTMLタグを除去
    const withoutTags = str.replace(/<[^>]*>/g, '');
    // スクリプト実行可能な文字列パターンを除去
    const safe = withoutTags
      .replace(/javascript:/gi, '')
      .replace(/on\w+\s*=/gi, '')
      .replace(/<script/gi, '');
    return safe.slice(0, maxLength).trim();
  }

  function safeParseNumber(value, min, max, defaultValue) {
    const num = Number(value);
    if (isNaN(num) || num < min || num > max) return defaultValue;
    return num;
  }

  function generateSafeId() {
    return crypto.randomUUID ? crypto.randomUUID() : 
      'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
  }

  // Status/Error/Success
  function updateStatus(msg) { 
    status.textContent = msg; 
    errorMsg.innerHTML = ''; 
    successMsg.innerHTML = ''; 
  }

  function showError(msg) { 
    errorMsg.innerHTML = '<div class="error">' + sanitizeString(msg, 500) + '</div>'; 
    successMsg.innerHTML = ''; 
  }

  function showSuccess(msg) { 
    successMsg.innerHTML = '<div class="success-msg">' + sanitizeString(msg, 500) + '</div>'; 
    errorMsg.innerHTML = ''; 
  }

  // Voice loading
  function loadVoices() {
    const voices = speechSynthesis.getVoices();
    const currentVal = voiceSel.value;
    voiceSel.innerHTML = '';
    
    const preferredLangs = ['en-US', 'en-GB', 'en-AU', 'ja-JP'];
    const filtered = voices.filter(v => 
      preferredLangs.some(lang => v.lang.startsWith(lang))
    );
    
    const toShow = filtered.length ? filtered : voices;
    toShow.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = `${v.name} (${v.lang})`;
      voiceSel.appendChild(opt);
    });
    
    // 英語音声を自動選択（en-US優先）
    if (!currentVal || currentVal === '') {
      const enUSVoice = toShow.find(v => v.lang.startsWith('en-US'));
      const enVoice = enUSVoice || toShow.find(v => v.lang.startsWith('en-'));
      if (enVoice) {
        voiceSel.value = enVoice.name;
      }
    } else if ([...voiceSel.options].some(opt => opt.value === currentVal)) {
      voiceSel.value = currentVal;
    }
  }

  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  loadVoices();

  // Split sentences
  splitBtn.onclick = () => {
    const rawText = text.value.trim();
    if (!rawText) { 
      showError('テキストを入力してください'); 
      return; 
    }
    
    const sanitized = sanitizeString(rawText, 50000);
    const lines = sanitized.split(/\n+/).map(line => line.trim()).filter(Boolean);
    
    const newSents = [];
    lines.forEach(line => {
      const parts = line.match(/[^.!?]+[.!?]+/g) || [line];
      parts.forEach(p => {
        const clean = p.trim();
        if (clean) {
          newSents.push({ 
            id: generateSafeId(), 
            text: clean, 
            jp: '' 
          });
        }
      });
    });
    
    if (!newSents.length) { 
      showError('有効な文が見つかりませんでした'); 
      return; 
    }
    
    sentences = newSents;
    idx = sentences.length ? 0 : -1;
    renderList();
    updateStatus(`${sentences.length}文を分割しました`);
    showSuccess('文の分割が完了しました');
    updateProgress();
  };

  clearBtn.onclick = () => {
    if (!confirm('すべての文をクリアしますか?')) return;
    text.value = '';
    sentences = [];
    idx = -1;
    renderList();
    updateStatus('クリアしました');
    updateProgress();
  };

  loadDefaultBtn.onclick = () => {
    if (sentences.length && !confirm('現在のデータを上書きしますか?')) return;
    loadDataFromJSON(DEFAULT_DATA);
    showSuccess('早口言葉データを読み込みました(R/L発音練習用)');
  };

  // 和訳関連
  attachJp.onclick = () => {
    const lines = jpInput.value.split('\n').map(l => l.trim());
    sentences.forEach((s, i) => {
      s.jp = lines[i] || '';
    });
    renderList();
    updateStatus('和訳を反映しました');
    showSuccess('和訳の反映が完了しました');
  };

  clearJp.onclick = () => {
    if (!confirm('すべての和訳をクリアしますか?')) return;
    sentences.forEach(s => { s.jp = ''; });
    jpInput.value = '';
    renderList();
    updateStatus('和訳をクリアしました');
  };

  copyJp.onclick = () => {
    const numbered = sentences.map((s, i) => `${i + 1}. ${s.jp || '(未入力)'}`).join('\n');
    navigator.clipboard.writeText(numbered).then(() => {
      showSuccess('番号付き和訳をクリップボードにコピーしました');
    }).catch(() => {
      showError('コピーに失敗しました');
    });
  };

  printJp.onclick = () => {
    const printContent = sentences.map((s, i) => 
      `<div style="margin-bottom:10px"><strong>${i + 1}. ${s.text}</strong><br>${s.jp || '(未入力)'}</div>`
    ).join('');
    
    const printWindow = window.open('', '_blank');
    printWindow.document.write(`
      <html>
      <head>
        <title>和訳一覧</title>
        <style>
          body { font-family: sans-serif; padding: 20px; }
          @media print { body { padding: 0; } }
        </style>
      </head>
      <body>${printContent}</body>
      </html>
    `);
    printWindow.document.close();
    printWindow.print();
  };

  // Render list
  function renderList() {
    if (!sentences.length) { 
      list.innerHTML = '<div class="muted">文がありません</div>'; 
      return; 
    }
    
    list.innerHTML = sentences.map((s, i) => {
      const isActive = i === idx ? 'active' : '';
      const jpLine = showJP && s.jp ? `<div class="jp">${sanitizeString(s.jp, 500)}</div>` : '';
      return `
        <div class="sent ${isActive}" data-idx="${i}">
          <div><strong>${i + 1}</strong></div>
          <div>
            <div class="en">${sanitizeString(s.text, 500)}</div>
            ${jpLine}
          </div>
          <button onclick="event.stopPropagation();jumpToSentence(${i})">▶</button>
        </div>
      `;
    }).join('');
  }

  window.jumpToSentence = function(targetIdx) {
    canceling = true;
    playing = false;
    paused = false;
    speechSynthesis.cancel();
    
    if (window.currentSpeakTimeout) {
      clearTimeout(window.currentSpeakTimeout);
      window.currentSpeakTimeout = null;
    }
    
    setTimeout(() => {
      canceling = false;
      idx = targetIdx;
      playing = true;
      paused = false;
      renderList();
      updateProgress();
      playFromIndex();
    }, 150);
  };

  function updateProgress() {
    if (sentences.length === 0) {
      prog.value = 0;
      prog.max = 1;
    } else {
      prog.value = idx >= 0 ? idx : 0;
      prog.max = Math.max(sentences.length - 1, 1);
    }
  }

  // Speech
  function speak(txt, callback) {
    if (canceling) { 
      if (callback) callback(); 
      return; 
    }
    
    const u = new SpeechSynthesisUtterance(txt);
    u.volume = Number(vol.value);
    u.rate = Number(rate.value);
    u.pitch = Number(pitch.value);
    u.lang = langHint.value;
    
    const voiceName = voiceSel.value;
    if (voiceName) {
      const voices = speechSynthesis.getVoices();
      const found = voices.find(v => v.name === voiceName);
      if (found) u.voice = found;
    }
    
    u.onend = () => { 
      if (callback && !canceling) callback(); 
    };
    
    u.onerror = (e) => {
      console.error('Speech error:', e);
      if (callback && !canceling) callback();
    };
    
    speechSynthesis.speak(u);
  }

  function playFromIndex() {
    if (idx < 0 || idx >= sentences.length || !playing || paused) return;
    
    const s = sentences[idx];
    const repeatCount = parseInt(repeatEach.value) || 1;
    const gapMs = (parseFloat(gapEach.value) || 0) * 1000;
    
    renderList();
    updateProgress();
    updateStatus(`再生中: ${idx + 1}/${sentences.length} (${repeatCount}回)`);
    
    let count = 0;
    
    function speakOne() {
      if (!playing || paused || canceling) return;
      
      count++;
      speak(s.text, () => {
        if (!playing || paused || canceling) return;
        
        if (count < repeatCount) {
          window.currentSpeakTimeout = setTimeout(speakOne, gapMs);
        } else {
          idx++;
          if (idx < sentences.length) {
            window.currentSpeakTimeout = setTimeout(playFromIndex, gapMs);
          } else {
            playing = false;
            updateStatus('再生完了');
            idx = sentences.length ? 0 : -1;
            renderList();
            updateProgress();
          }
        }
      });
    }
    
    speakOne();
  }

  function jumpTo(newIdx, autoPlay = false) {
    if (newIdx < 0 || newIdx >= sentences.length) return;
    idx = newIdx;
    renderList();
    updateProgress();
    if (autoPlay) {
      playing = true;
      paused = false;
      playFromIndex();
    } else {
      updateStatus(`文 ${idx + 1} に移動しました`);
    }
  }

  // Controls
  startBtn.onclick = () => {
    if (!sentences.length) { 
      showError('文がありません'); 
      return; 
    }
    
    if (playing && !paused) { 
      showError('既に再生中です'); 
      return; 
    }
    
    if (paused) {
      paused = false;
      updateStatus('再生再開');
      playFromIndex();
      return;
    }
    
    if (idx < 0) idx = 0;
    playing = true;
    paused = false;
    updateStatus('再生開始');
    showSuccess('再生を開始しました');
    playFromIndex();
  };

  pauseBtn.onclick = () => {
    if (!playing) { 
      showError('再生されていません'); 
      return; 
    }
    
    if (paused) {
      paused = false;
      updateStatus('再生再開');
      playFromIndex();
    } else {
      paused = true;
      speechSynthesis.cancel();
      updateStatus('一時停止中');
    }
  };

  stopBtn.onclick = () => {
    if (!playing && !paused) { 
      showError('再生されていません'); 
      return; 
    }
    
    canceling = true;
    playing = false;
    paused = false;
    speechSynthesis.cancel();
    
    if (window.currentSpeakTimeout) {
      clearTimeout(window.currentSpeakTimeout);
      window.currentSpeakTimeout = null;
    }
    
    setTimeout(() => {
      canceling = false;
      idx = sentences.length ? 0 : -1;
      renderList();
      updateProgress();
      updateStatus('停止しました');
    }, 100);
  };

  prevBtn.onclick = () => {
    if (idx > 0) {
      const wasPlaying = playing;
      canceling = true;
      playing = false;
      speechSynthesis.cancel();
      
      if (window.currentSpeakTimeout) {
        clearTimeout(window.currentSpeakTimeout);
        window.currentSpeakTimeout = null;
      }
      
      setTimeout(() => {
        canceling = false;
        jumpTo(idx - 1, wasPlaying);
      }, 150);
    }
  };

  nextBtn.onclick = () => {
    if (idx < sentences.length - 1) {
      const wasPlaying = playing;
      canceling = true;
      playing = false;
      speechSynthesis.cancel();
      
      if (window.currentSpeakTimeout) {
        clearTimeout(window.currentSpeakTimeout);
        window.currentSpeakTimeout = null;
      }
      
      setTimeout(() => {
        canceling = false;
        jumpTo(idx + 1, wasPlaying);
      }, 150);
    }
  };

  // Click list to jump
  list.addEventListener('click', (e) => {
    const row = e.target.closest('.sent');
    if (!row) return;
    
    const targetIdx = parseInt(row.dataset.idx);
    if (!isNaN(targetIdx) && targetIdx >= 0 && targetIdx < sentences.length) {
      canceling = true;
      playing = false;
      paused = false;
      speechSynthesis.cancel();
      
      if (window.currentSpeakTimeout) {
        clearTimeout(window.currentSpeakTimeout);
        window.currentSpeakTimeout = null;
      }
      
      setTimeout(() => {
        canceling = false;
        idx = targetIdx;
        playing = true;
        paused = false;
        renderList();
        updateProgress();
        playFromIndex();
      }, 150);
    }
  });

  // Keyboard
  window.addEventListener('keydown', (e) => {
    if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
    if (e.code === 'Space') { 
      e.preventDefault(); 
      pauseBtn.click(); 
    } else if (e.key === 'ArrowRight') { 
      e.preventDefault(); 
      nextBtn.click(); 
    } else if (e.key === 'ArrowLeft') { 
      e.preventDefault(); 
      prevBtn.click(); 
    } else if (e.key.toLowerCase() === 't') { 
      showJP = !showJP; 
      renderList(); 
    }
  });

  // ===== セキュリティ強化: 厳密なJSONデータ検証 =====
  function validateImportedData(data) {
    if (typeof data !== 'object' || data === null) {
      throw new Error('Invalid data format');
    }
    
    if (!Array.isArray(data.sentences)) {
      throw new Error('Invalid sentences format');
    }
    
    const validatedSentences = data.sentences
      .slice(0, 1000)
      .map(x => {
        if (typeof x !== 'object' || x === null) return null;
        return {
          id: generateSafeId(),
          text: sanitizeString(String(x.text || ''), 5000),
          jp: sanitizeString(String(x.jp || ''), 5000)
        };
      })
      .filter(x => x !== null && x.text);
    
    const validatedSettings = {};
    if (typeof data.settings === 'object' && data.settings !== null) {
      validatedSettings.repeatEach = safeParseNumber(data.settings.repeatEach, 1, 50, 50);
      validatedSettings.gapEach = safeParseNumber(data.settings.gapEach, 0, 10, 0.8);
      validatedSettings.vol = safeParseNumber(data.settings.vol, 0, 1, 1);
      validatedSettings.rate = safeParseNumber(data.settings.rate, 0.5, 2, 1);
      validatedSettings.pitch = safeParseNumber(data.settings.pitch, 0, 2, 1);
      validatedSettings.voice = sanitizeString(String(data.settings.voice || ''), 200);
      validatedSettings.langHint = ['en-US', 'en-GB', 'en-AU', 'ja-JP'].includes(data.settings.langHint) 
        ? data.settings.langHint 
        : 'en-US';
      validatedSettings.showJP = Boolean(data.settings.showJP);
    }
    
    return { sentences: validatedSentences, settings: validatedSettings };
  }

  function loadDataFromJSON(data) {
    try {
      const validated = validateImportedData(data);
      
      sentences = validated.sentences;
      
      if (validated.settings) {
        repeatEach.value = validated.settings.repeatEach;
        gapEach.value = validated.settings.gapEach;
        vol.value = validated.settings.vol;
        rate.value = validated.settings.rate;
        pitch.value = validated.settings.pitch;
        langHint.value = validated.settings.langHint;
        showJP = validated.settings.showJP;
        loadVoices(); 
        if (validated.settings.voice) {
          voiceSel.value = validated.settings.voice;
        }
      }
      
      idx = sentences.length ? 0 : -1; 
      renderList(); 
      updateStatus('設定を読み込みました'); 
      updateProgress();
    } catch(e) { 
      showError('データの読み込みに失敗しました: ' + e.message);
    }
  }

  // Export/Import
  exportBtn.onclick = () => {
    const data = {
      version: 2, 
      sentences, 
      settings: {
        repeatEach: Number(repeatEach.value), 
        gapEach: Number(gapEach.value),
        vol: Number(vol.value), 
        rate: Number(rate.value), 
        pitch: Number(pitch.value),
        voice: voiceSel.value, 
        langHint: langHint.value, 
        showJP
      }
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const a = document.createElement('a'); 
    a.href = URL.createObjectURL(blob); 
    a.download = 'shadowing_tts_config.json'; 
    a.click();
  };

  function handleFileImport(file) {
    if (!file) return;
    
    if (file.size > 5 * 1024 * 1024) {
      showError('ファイルサイズが大きすぎます(最大5MB)');
      return;
    }
    
    const r = new FileReader(); 
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        loadDataFromJSON(d);
        showSuccess('JSONファイルを読み込みました');
      } catch(e) { 
        showError('JSONファイルの読み込みに失敗しました: ' + e.message);
      }
    }; 
    r.onerror = () => {
      showError('ファイルの読み込みに失敗しました');
    };
    r.readAsText(file);
  }
  
  importFile.onchange = () => {
    handleFileImport(importFile.files?.[0]);
  };

  topImportFile.onchange = () => {
    handleFileImport(topImportFile.files?.[0]);
  };

  // ページ読み込み時にデフォルトデータを自動読み込み
  window.addEventListener('load', () => {
    setTimeout(() => {
      loadDataFromJSON(DEFAULT_DATA);
      showSuccess('早口言葉データを自動読み込みしました(R/L発音練習用)');
    }, 500);
  });

  // iOS/Safari notice
  if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
    updateStatus('iOSはTTS初回再生にユーザー操作が必要です。サイレントスイッチに注意。');
  }
</script>
</body>
</html>
